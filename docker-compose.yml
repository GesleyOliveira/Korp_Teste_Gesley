version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: korp-postgres
    environment:
      POSTGRES_USER: korp-gesley
      POSTGRES_PASSWORD: korp123
      POSTGRES_DB: korp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: